<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bh-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ff1b6b" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>
    <filter id="b1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Back half of rings (glows) -->
  <path d="M 2 14 A 12 3.5 0 0 1 26 14" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <path d="M 4.5 14 A 9.5 2 0 0 1 23.5 14" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <!-- Back half of rings (cores) -->
  <path d="M 2 14 A 12 3.5 0 0 1 26 14" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />
  <path d="M 4.5 14 A 9.5 2 0 0 1 23.5 14" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />

  <!-- Concentric Circles (glows) -->
  <circle cx="14" cy="14" r="8.5" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <circle cx="14" cy="14" r="6.5" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <!-- Concentric Circles (cores) -->
  <circle cx="14" cy="14" r="8.5" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />
  <circle cx="14" cy="14" r="6.5" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />
  
  <!-- Central Void -->
  <circle cx="14" cy="14" r="4.5" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#b1)" />
  <circle cx="14" cy="14" r="4.5" stroke="url(#bh-grad)" stroke-width="0.8" fill="#0a0b10" />

  <!-- Front half of rings (glows) -->
  <path d="M 2 14 A 12 3.5 0 0 0 26 14" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <path d="M 4.5 14 A 9.5 2 0 0 0 23.5 14" stroke="url(#bh-grad)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#b1)" />
  <!-- Front half of rings (cores) -->
  <path d="M 2 14 A 12 3.5 0 0 0 26 14" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />
  <path d="M 4.5 14 A 9.5 2 0 0 0 23.5 14" stroke="url(#bh-grad)" stroke-width="0.8" fill="none" />
</svg>
