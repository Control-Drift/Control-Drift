version: "3.8"

services:
  # -----------------------------------------------------------
  # Control Drift - Frontend Application
  # -----------------------------------------------------------
  control-drift:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    container_name: control-drift
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the configuration file directly so admins can edit it without rebuilding
      - ./config.json:/usr/share/nginx/html/config.json
      - ./certs:/etc/nginx/ssl
    restart: always

  # -----------------------------------------------------------
  # AI Proxy - LiteLLM
  # -----------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: control-drift-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Master keys securely loaded on the server
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-dummy}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: always

networks:
  default:
    name: supabase_default
    external: true
